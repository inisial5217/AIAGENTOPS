name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Semantic Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      source_image_tag:
        description: 'Source Staging Image Tag to Promote (e.g. staging-<sha>)'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  promote-and-deploy:
    name: Promote Image & Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cifo.production.internal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crane for Fast Image Retagging
        uses: imjasonh/setup-crane@v0.3

      - name: Promote and Retag Images (Backend, Frontend, AI Service)
        run: |
          SRC="ghcr.io/${{ github.repository }}"
          TAG="${{ github.event.inputs.source_image_tag }}"
          VER="${{ github.event.inputs.version_tag }}"

          echo "Promoting Backend $TAG -> $VER, latest..."
          crane copy "$SRC/backend:$TAG" "$SRC/backend:$VER"
          crane copy "$SRC/backend:$TAG" "$SRC/backend:latest"

          echo "Promoting Frontend $TAG -> $VER, latest..."
          crane copy "$SRC/frontend:$TAG" "$SRC/frontend:$VER"
          crane copy "$SRC/frontend:$TAG" "$SRC/frontend:latest"

          echo "Promoting AI Service $TAG -> $VER, latest..."
          crane copy "$SRC/ai-service:$TAG" "$SRC/ai-service:$VER"
          crane copy "$SRC/ai-service:$TAG" "$SRC/ai-service:latest"

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Image Tags in Production Overlay
        working-directory: infrastructure/kubernetes/overlays/production
        run: |
          VER="${{ github.event.inputs.version_tag }}"
          kustomize edit set image cifo-backend=ghcr.io/${{ github.repository }}/backend:$VER
          kustomize edit set image cifo-frontend=ghcr.io/${{ github.repository }}/frontend:$VER
          kustomize edit set image cifo-ai-service=ghcr.io/${{ github.repository }}/ai-service:$VER

      - name: Commit and Push Production Release
        run: |
          VER="${{ github.event.inputs.version_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/production/kustomization.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "release(production): promote images to $VER [skip ci]" && git push)

      - name: Trigger ArgoCD Production Manual Sync
        if: env.ARGOCD_SERVER != ''
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          echo "Triggering controlled ArgoCD Production Sync..."
          curl -s -k -X POST -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            "https://$ARGOCD_SERVER/api/v1/applications/cifo-production/sync" \
            -d '{"revision": "main", "prune": false}' || echo "Production ArgoCD sync command triggered"
