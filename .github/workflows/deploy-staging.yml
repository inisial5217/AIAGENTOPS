name: Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build and Push Staging Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.val }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: tag
        run: echo "val=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.val }}
            ghcr.io/${{ github.repository }}/backend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.val }}
            ghcr.io/${{ github.repository }}/frontend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push AI Service
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ai-service:${{ steps.tag.outputs.val }}
            ghcr.io/${{ github.repository }}/ai-service:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-staging-gitops:
    name: Update Staging Manifests & Sync ArgoCD
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Image Tags in Staging Overlay
        working-directory: infrastructure/kubernetes/overlays/staging
        run: |
          kustomize edit set image cifo-backend=ghcr.io/${{ github.repository }}/backend:${{ needs.build-and-push.outputs.image_tag }}
          kustomize edit set image cifo-frontend=ghcr.io/${{ github.repository }}/frontend:${{ needs.build-and-push.outputs.image_tag }}
          kustomize edit set image cifo-ai-service=ghcr.io/${{ github.repository }}/ai-service:${{ needs.build-and-push.outputs.image_tag }}

      - name: Commit and Push Manifest Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/staging/kustomization.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update staging images to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" && git push)

      - name: Trigger ArgoCD Sync (Staging)
        if: env.ARGOCD_SERVER != ''
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          curl -s -k -X POST -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            "https://$ARGOCD_SERVER/api/v1/applications/cifo-staging/sync" || echo "ArgoCD notification dispatched"
