run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gofmt
    - ineffassign

linters-settings:
  govet:
    enable-all: false
    disable:
      - fieldalignment
  errcheck:
    check-type-assertions: true
    check-blank: false

issues:
  exclude-dirs:
    - bin
    - coverage
    - tests/load
    - node_modules
  max-issues-per-linter: 50
  max-same-issues: 10
