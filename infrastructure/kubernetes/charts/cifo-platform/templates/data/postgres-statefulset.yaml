{{- if and .Values.data .Values.data.postgres.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cifo.fullname" . }}-postgres
  labels:
    {{- include "cifo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "cifo.fullname" . }}-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "cifo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "cifo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.data.postgres.image }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.data.postgres.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.data.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.data.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.data.postgres.existingSecret }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.data.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.data.postgres.storageClass }}
        storageClassName: {{ .Values.data.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.data.postgres.storageSize }}
{{- end }}
