apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cifo-staging

namePrefix: staging-

resources:
  - ../../base

commonLabels:
  environment: staging

images:
  - name: cifo-backend
    newName: ghcr.io/cifo/backend
    newTag: staging-latest
  - name: cifo-frontend
    newName: ghcr.io/cifo/frontend
    newTag: staging-latest
  - name: cifo-ai-service
    newName: ghcr.io/cifo/ai-service
    newTag: staging-latest
