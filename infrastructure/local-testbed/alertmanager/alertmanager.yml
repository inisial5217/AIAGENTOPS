global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "cifo-backend-webhook"
  routes:
    - match:
        severity: CRITICAL
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      receiver: "cifo-backend-webhook-critical"

receivers:
  - name: "cifo-backend-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:8080/api/v1/webhooks/alertmanager"
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: "cifo-backend-webhook-critical"
    webhook_configs:
      - url: "http://host.docker.internal:8080/api/v1/webhooks/alertmanager"
        send_resolved: true
        http_config:
          follow_redirects: true
