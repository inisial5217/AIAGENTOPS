apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cifo-monitoring-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cifo-platform
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: kustomize-guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
