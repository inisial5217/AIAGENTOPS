apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cifo-dev
servers: 1
agents: 2
image: rancher/k3s:v1.28.8-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6443"
ports:
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  - port: 8081:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "360s"
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
