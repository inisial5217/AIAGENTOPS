syntax = "proto3";

package cifo.common;

option go_package = "github.com/cifo-monitoring/backend/pkg/proto/common;common";

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_CRITICAL = 3;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
  string code = 3;
}
